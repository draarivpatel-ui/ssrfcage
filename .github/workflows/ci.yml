name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  verify:
    name: ${{ matrix.os }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify zero runtime dependencies
        shell: bash
        run: node -e "const p=require('./package.json'); if(Object.keys(p.dependencies || {}).length!==0) process.exit(1)"
      - name: Run deterministic test suite
        shell: bash
        run: npm test
      - name: Verify generated CommonJS build is current
        shell: bash
        run: node scripts/build-cjs.mjs --check
      - name: Run strict TypeScript declaration check
        shell: bash
        run: node scripts/check-types.mjs
      - name: Run CLI smoke tests
        shell: bash
        run: node scripts/cli-smoke.mjs
      - name: Run examples
        shell: bash
        run: |
          node examples/basic.mjs
          node examples/resolved-target.mjs
          node examples/redirect-chain.mjs
      - name: Inspect npm package dry run
        shell: bash
        run: npm pack --dry-run
      - name: Verify package tarball contents
        shell: bash
        run: node scripts/check-pack.mjs

  fuzz:
    name: property fuzz
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Run property fuzz tests
        run: npm run test:fuzz
